name: Sync Marktplatz Data

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run sync script
        run: python .github/scripts/sync_marktplatz.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marktplatz_data.json
          git diff --staged --quiet || git commit -m "Auto-sync marktplatz data $(date +'%Y-%m-%d')"
          git push
